<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--HTML Code-->
    <h1 id="heading">
        Hello World
    </h1>
    <img id="photo" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR-LFqXfJia1u847i_5uyWY3DuVGJqz3vmeIPyxYT5VHQ&s" alt="">

    <script>
        //selector
        let heading=document.querySelector("#heading")
        heading.innerHTML="This is DOM Class"
        heading.style.color="aqua"
        heading.style.backgroundColor="red"
        heading.style.border="3px solid black"
        heading.style.textAlign="center"
       let photo=document.querySelector("#photo")
       photo.style.width="500px"
       photo.style.height="300px"
       photo.src="https://i.pinimg.com/originals/16/f3/15/16f3158eab90cca32a1f735566c9eb22.jpg"
       photo.style.border="3px solid aqua"
    </script>
</body>
</html>
